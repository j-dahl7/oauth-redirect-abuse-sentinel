name: Validate OAuth lab safety

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Parse PowerShell entry points
        shell: pwsh
        run: |
          Get-ChildItem scripts,hardening -Filter '*.ps1' | ForEach-Object {
            $tokens=$null; $errors=$null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName,[ref]$tokens,[ref]$errors)
            if ($errors.Count) { throw ($errors | ForEach-Object Message | Out-String) }
          }
      - name: Run mocked and offline safety tests
        run: python -m unittest discover -s tests -v
      - name: Analyze rules, hunts, and workbook KQL against documented columns
        shell: pwsh
        run: |
          $directory = Join-Path $env:RUNNER_TEMP 'kusto-language-12.4.1'
          New-Item -ItemType Directory -Path $directory -Force | Out-Null
          $archive = Join-Path $directory 'kusto.zip'
          Invoke-WebRequest -Uri 'https://api.nuget.org/v3-flatcontainer/microsoft.azure.kusto.language/12.4.1/microsoft.azure.kusto.language.12.4.1.nupkg' -OutFile $archive
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash -ne '154C176AC9C1C4AE9CF0BC53B74354C9D35798FF587F81FE6E0005028A0A1961') { throw 'Kusto language package checksum mismatch' }
          Expand-Archive -LiteralPath $archive -DestinationPath (Join-Path $directory 'package')
          ./scripts/Test-QuerySyntax.ps1 -KustoAssembly (Join-Path $directory 'package/lib/net6.0/Kusto.Language.dll')
